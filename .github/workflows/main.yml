name: Build Chary APK from zip
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q chary.zip
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Set up and build
        working-directory: chary
        run: |
          bash setup.sh
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chary-apk
          path: chary/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish the APK as a release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp chary/build/app/outputs/flutter-apk/app-release.apk Chary.apk
          gh release create "v${{ github.run_number }}" Chary.apk --title "Chary (Android) v${{ github.run_number }}" --notes "Download Chary.apk on your phone, open it and allow installing from this source. Uninstall any older copy first."
